<!DOCTYPE html>
<html lang="en">
  <!-- public/index.html -->
  <head>
    <meta charset="utf-8" />
    <!-- Pinch-zoom stays enabled on purpose: a learner with low vision or
         dyslexia must be able to zoom (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- public/index.html -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Stellar — a calm, playful Arabic learning app built for neurodiverse learners." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Noto+Kufi+Arabic:wght@700&display=swap" rel="stylesheet">
    <!-- Inter removed; OpenDyslexic used instead for dyslexia-friendly text -->
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Stellar</title>

    <!-- ✅ Required for other components -->
    <!-- Puter.js: powers the text and voice chat (see src/utils/aiClient.js) -->
    <script src="https://js.puter.com/v2/" async></script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
